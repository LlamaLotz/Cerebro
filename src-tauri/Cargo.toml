[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linker-cli"
path = "src/bin/linker-cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
walkdir = "2"
aho-corasick = "1.1"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
memmap2 = "0.9"
tempfile = "3.10"
notify = "6.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
fastembed = "3.4"
hnsw_rs = "0.3"
rayon = "1.10"
# Pin ort-sys to the version ort 2.0.0-rc.4 (used by fastembed) was built
# against; its build script predates the newer TLS feature requirement.
ort-sys = "=2.0.0-rc.4"

