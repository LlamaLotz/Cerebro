[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linker-cli"
path = "src/bin/linker-cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
walkdir = "2"
aho-corasick = "1.1"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
memmap2 = "0.9"
tempfile = "3.10"
notify = "6.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
fastembed = "3.4"
hnsw_rs = "0.3"
rayon = "1.10"
# Pin ort-sys to the version ort 2.0.0-rc.4 (used by fastembed) was built
# against; its build script predates the newer TLS feature requirement.
ort-sys = "=2.0.0-rc.4"

# Prism patch: vendored fastembed with the ONNX intra-op thread pool capped
# at 2 threads. Stock fastembed spins up one thread per logical CPU, so the
# embedding job that runs on every note save saturates all cores (~96% CPU
# spike). See vendor/fastembed/src/text_embedding.rs.
[patch.crates-io]
fastembed = { path = "vendor/fastembed" }

[target.'cfg(windows)'.dependencies]
# Direct use of the WebView2 COM bindings (same version wry/tauri use) so the
# app can disable browser accelerator keys natively — JS preventDefault cannot
# stop WebView2's own handling of Ctrl+P / Ctrl+R / F5 / F12 / etc.
webview2-com = "0.38.2"
# For Interface::cast (up-casting ICoreWebView2Settings -> Settings3, which
# carries AreBrowserAcceleratorKeysEnabled).
windows-core = "0.61.2"

