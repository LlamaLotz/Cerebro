[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linker-cli"
path = "src/bin/linker-cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
rfd = "0.15"
walkdir = "2"
aho-corasick = "1.1"
rusqlite = { version = "0.31", features = ["bundled"] }
memmap2 = "0.9"
tempfile = "3.10"

